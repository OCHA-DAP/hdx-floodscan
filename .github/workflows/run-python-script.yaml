# The HDX publish no longer runs on GitHub runners: the rasterstats Postgres
# servers are private-endpoint only, so it runs as the Databricks job
# "HDX FloodScan Publish" (databricks.yml). This workflow is kept so the
# upstream "Run FloodScan" Databricks job, whose last task still dispatches it,
# keeps succeeding — it does nothing but say where the publish went.

name: Run script

on:
  workflow_dispatch: # add run button in github
  repository_dispatch:
    types:
      - webhook

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Publish moved to Databricks
        run: |
          echo "The HDX FloodScan publish runs as the Databricks job 'HDX FloodScan Publish'"
          echo "(see databricks.yml). This workflow is a no-op kept for the upstream dispatch."
