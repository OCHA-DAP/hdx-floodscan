# HDX FloodScan publisher.
#
# The DB half (queries against public.floodscan on the private-endpoint-only
# rasterstats DB) runs as the Databricks job "HDX FloodScan Prepare"
# (databricks.yml, 00:15 UTC), which parks the results on the dev blob and then
# dispatches this workflow. This workflow builds the dataset from those
# intermediates + the prod raster blob and publishes to HDX with the HDX org
# secrets, which never leave GitHub.
#
# Freshness guard: the upstream "Run FloodScan" Databricks job also dispatches
# this workflow when it finishes (~23:20 UTC), i.e. BEFORE the prepare job has
# run. scripts/check_intermediates.py then finds a stale manifest and the
# publish is skipped (green, not failed). Dispatch by hand with force=true to
# publish whatever is in latest/ regardless.

name: Run script

on:
  workflow_dispatch: # add run button in github
    inputs:
      force:
        description: "Publish even if the blob intermediates are older than the freshness window"
        type: boolean
        default: false
  repository_dispatch:
    types:
      - webhook

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Check blob intermediates are fresh
      id: check
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
      run: |
        test -n "$DSCI_AZ_BLOB_DEV_SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
        python scripts/check_intermediates.py --max-age-hours 6 --force "${{ inputs.force || 'false' }}"
    - name: Run script
      if: steps.check.outputs.publish == 'true'
      env:
        HDX_SITE: ${{ secrets.HDX_SITE }}
        HDX_KEY: ${{ secrets.HDX_BOT_SCRAPERS_API_TOKEN }}
        PREPREFIX: ${{ secrets.HDX_PIPELINE_PREPREFIX }}
        USER_AGENT: ${{ secrets.USER_AGENT }}
        # intermediates (dev blob) + rasters / admin lookup (prod blob), via ocha-stratus
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
      run: |
        test -n "$DSCI_AZ_BLOB_PROD_SAS" || { echo "::error::DSCI_AZ_BLOB_PROD_SAS org secret is not visible to this repo"; exit 1; }
        python run.py
    - name: Send mail
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{secrets.HDX_PIPELINE_EMAIL_SERVER}}
        server_port: ${{secrets.HDX_PIPELINE_EMAIL_PORT}}
        username: ${{secrets.HDX_PIPELINE_EMAIL_USERNAME}}
        password: ${{secrets.HDX_PIPELINE_EMAIL_PASSWORD}}
        subject: "FAILED: ${{github.repository}} run job"
        body: GitHub Actions run job for ${{github.repository}} failed!
        to: ${{secrets.HDX_EMAIL_LIST}}
        from: ${{secrets.HDX_PIPELINE_EMAIL_FROM}}
        content_type: text/html
