# Databricks Asset Bundle — the HDX FloodScan publish as a Databricks job.
#
# Why Databricks: the rasterstats Postgres servers are losing public network
# access. GitHub runners can't reach the private endpoint, so the publish
# (which reads public.floodscan from the prod DB) moves onto Job Compute inside
# the workspace VNet. The DB host + creds come from the dsci secret scope via
# the Job Compute policy (ocha-stratus reads DSCI_AZ_DB_PROD_*); nothing in
# this repo names a host, so flipping private IP <-> FQDN is a secret change.
#
#   databricks bundle validate -t prod -p default
#   databricks bundle deploy   -t prod -p default
#   databricks bundle run hdx_floodscan_publish -t prod -p default
#
# Chaining: upstream is the "Run FloodScan" workspace job in ds-raster-pipelines
# (23:00 UTC, ~20 min: download -> Raster Stats FLOODSCAN -> "Trigger GitHub
# Action"). Ideal wiring is for its last task to become a run_job_task pointing
# at this job (then set pause_status: PAUSED here). Until the owner of that job
# does so, this job runs on its own schedule 75 min after the upstream start.
#
# Secrets this job needs in the dsci scope beyond the policy defaults:
#   HDX_KEY          HDX API token of the hdx bot (was GH secret HDX_BOT_SCRAPERS_API_TOKEN)
#   HDX_USER_AGENT   user-agent string (was GH secret USER_AGENT)
#   HDX_PREPREFIX    user-agent preprefix (was GH secret HDX_PIPELINE_PREPREFIX)

bundle:
  name: hdx-floodscan

sync:
  exclude:
    - "exploration/**"

variables:
  git_branch:
    description: Branch the job pulls the code from
    default: main
  existing_cluster_id:
    description: Interactive cluster for the dev target
    default: "0515-161935-i2w5mxhc"
  hdx_site:
    description: HDX site to publish to ("prod" | "stage" | "demo")
    default: "prod"
  pause_status:
    description: Schedule state for the prod target (PAUSED while secrets are missing or once chained upstream)
    default: "UNPAUSED"

targets:
  dev:
    # Feature-branch testing on the personal cluster:
    #   databricks bundle deploy -t dev -p default --var git_branch=my-branch
    # Development mode auto-pauses the schedule and prefixes the job name.
    mode: development
    default: true
    workspace:
      profile: default
    resources:
      jobs:
        hdx_floodscan_publish:
          tasks:
            - task_key: publish
              existing_cluster_id: ${var.existing_cluster_id}

  prod:
    mode: production
    workspace:
      profile: default
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: adm.tdowning@global.un.org
    resources:
      jobs:
        hdx_floodscan_publish:
          schedule:
            pause_status: ${var.pause_status}
          job_clusters:
            - job_cluster_key: publish_cluster
              new_cluster:
                # Job Compute policy (000C79D951EAF0D6): ephemeral single-worker
                # cluster with every dsci DB/blob secret injected as env vars.
                # 15.4 LTS matches the upstream Run FloodScan cluster, so the
                # pinned xarray/rioxarray/dask set below is known to install.
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "15.4.x-scala2.12"
                node_type_id: "Standard_DS4_v2"
                num_workers: 1
                spark_env_vars:
                  HDX_SITE: ${var.hdx_site}
                  HDX_KEY: "{{secrets/dsci/HDX_KEY}}"
                  USER_AGENT: "{{secrets/dsci/HDX_USER_AGENT}}"
                  PREPREFIX: "{{secrets/dsci/HDX_PREPREFIX}}"
          tasks:
            - task_key: publish
              job_cluster_key: publish_cluster

resources:
  jobs:
    hdx_floodscan_publish:
      name: HDX FloodScan Publish
      description: >-
        Builds the HDX "FloodScan" dataset (admin1/2 zonal-stats xlsx with
        return periods + baseline, and the 90-day SFED/SFED_BASELINE COG zip)
        from the prod rasterstats DB and prod raster blob, and updates it on HDX.
      git_source:
        git_url: https://github.com/OCHA-DAP/hdx-floodscan.git
        git_provider: gitHub
        git_branch: ${var.git_branch}
      schedule:
        # 00:15 UTC — "Run FloodScan" starts 23:00 UTC and has finished by ~23:20.
        quartz_cron_expression: "0 15 0 * * ?"
        timezone_id: UTC
      max_concurrent_runs: 1
      tags:
        databricks: job
        type: hdx-publish
        input_schema: public.floodscan
        output: hdx:floodscan
      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: publish
          timeout_seconds: 5400
          spark_python_task:
            python_file: run.py
            source: GIT
          # The prod job cluster is created fresh every run, so this list is
          # the ENTIRE non-DBR environment. Raster pins mirror the upstream
          # Run FloodScan job (same DBR 15.4).
          libraries:
            - pypi: { package: "hdx-python-api==6.6.5" }
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi: { package: "numpy==1.26.4" }
            - pypi: { package: "xarray==2024.3.0" }
            - pypi: { package: "rioxarray==0.16.0" }
            - pypi: { package: "dask==2024.7.0" }
            - pypi: { package: "netCDF4==1.7.2" }
            - pypi: { package: "h5netcdf==1.3.0" }
            - pypi: { package: "lmoments3==1.0.7" }
            - pypi: { package: "scipy" }
            - pypi: { package: "openpyxl>=3.1" }
            - pypi: { package: "coloredlogs==15.0.1" }
            - pypi: { package: "python-dotenv==1.0.1" }
            - pypi: { package: "tqdm==4.66.4" }
