# Databricks Asset Bundle — hdx-floodscan
#
# One job, "HDX FloodScan Prepare": the DB half of the HDX publish. The
# rasterstats Postgres is reachable only through its private endpoint, so the
# three public.floodscan queries the publish needs run here and are parked as
# parquet on the dev blob (projects/hdx-floodscan/intermediate/latest/ + dated
# copies + manifest.json). The task then dispatches the GitHub workflow
# run-python-script.yaml, which does the actual HDX publish from those
# intermediates with the HDX org secrets that only GitHub holds.
#
#     prepare   scripts/prepare_intermediates.py --stage prod --secret GH_FLOODSCAN_TOKEN
#
# The wrapper databricks/run_task.py sets STAGE (= which DB to read: prod),
# copies src/ + scripts/ off wsfs, resolves GH_FLOODSCAN_TOKEN from the dsci
# scope at run time (a missing key fails the task readably) and shells out.
# DB/blob credentials come from the Job Compute policy. No HDX credentials
# anywhere on Databricks.
#
# Timing: upstream "Run FloodScan" (ds-raster-pipelines, owner adm.itot6) runs
# 23:00 UTC and finishes in ~20 min; its own last task still dispatches the
# GitHub workflow, which the workflow's freshness guard turns into a no-op.
# This job runs 00:15 UTC and dispatches the real publish. Should the owner
# repoint Run FloodScan's last task at this job (run_job_task), redeploy with
# --var pause_status=PAUSED.
#
#   databricks bundle validate -t prod -p DEFAULT
#   databricks bundle deploy   -t prod -p DEFAULT
#   databricks bundle run hdx_floodscan_prepare -t prod -p DEFAULT
#   databricks bundle deploy   -t dev  -p DEFAULT --var git_branch=my-branch   # feature test (paused)

bundle:
  name: hdx-floodscan

sync:
  exclude:
    - "exploration/**"

variables:
  git_branch:
    description: Branch the job pulls the code from
    default: main
  stage:
    description: DB to read public.floodscan from (the intermediates always go to the dev blob)
    default: prod
  pause_status:
    description: Schedule state for the prod target (PAUSED once chained from Run FloodScan)
    default: "UNPAUSED"

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: adm.tdowning@global.un.org
    resources:
      jobs:
        hdx_floodscan_prepare:
          schedule:
            pause_status: ${var.pause_status}

resources:
  jobs:
    hdx_floodscan_prepare:
      name: HDX FloodScan Prepare
      description: "Prepare FloodScan zonal statistics for the [HDX floodscan dataset](https://data.humdata.org/dataset/floodscan)"
      git_source:
        git_url: https://github.com/OCHA-DAP/hdx-floodscan.git
        git_provider: gitHub
        git_branch: ${var.git_branch}
      schedule:
        # 00:15 UTC — "Run FloodScan" starts 23:00 UTC and has finished by ~23:20.
        quartz_cron_expression: "0 15 0 * * ?"
        timezone_id: UTC
      max_concurrent_runs: 1
      tags:
        input_schema: public.floodscan
        databricks: job
        type: publish
        hazard: flood
        kb: hdx-floodscan
        output_blob: projects/hdx-floodscan/intermediate
      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      parameters:
        - name: stage
          default: ${var.stage}
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            # Job Compute policy (000C79D951EAF0D6): ephemeral single-worker
            # cluster with every dsci DB/blob secret injected as env vars.
            policy_id: "000C79D951EAF0D6"
            apply_policy_default_values: true
            num_workers: 1
      tasks:
        - task_key: prepare
          job_cluster_key: main
          timeout_seconds: 3600
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/prepare_intermediates.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--secret"
              - "GH_FLOODSCAN_TOKEN"
          # Only the DB/blob side runs here — no raster or HDX libraries.
          libraries:
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi: { package: "psycopg2-binary" }
            - pypi: { package: "sqlalchemy>=2.0" }
            - pypi: { package: "pyarrow" }
            - pypi: { package: "python-dotenv" }
            - pypi: { package: "requests" }
